<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Seguro</title>
  <link rel="stylesheet" href="css/style-login.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-form">
      <h1>Entrar ou Criar Conta</h1>
      <div class="input-group">
        <label for="username">Usuário (email)</label>
        <input type="email" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <button type="button" id="registerBtn">Criar Conta</button>
      <p class="hint">Nunca compartilhe sua senha.</p>
    </form>
  </div>
</body>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/9.6.1/firebase-auth.js";

  const firebaseConfig = {
  apiKey: "AIzaSyAAWrKX6Vu3DJRmmMrTreR1iwUw_ytUnXg",
  authDomain: "base-total.firebaseapp.com",
  projectId: "base-total",
  storageBucket: "base-total.firebasestorage.app",
  messagingSenderId: "1052334488431",
  appId: "1:1052334488431:web:c8d2071a18bdb6f82e469a",
  measurementId: "G-TWSEGNXFXJ"
};

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  const emailInput = document.getElementById("username");
  const passwordInput = document.getElementById("password");

  // Login
  document.getElementById("loginBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      const userCredential = await signInWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      const token = await userCredential.user.getIdToken();
      await fetch("http://127.0.0.1:5500/home.html", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token })
      });
      alert("Login realizado com sucesso!");
    } catch (error) {
      alert("Erro ao fazer login: " + error.message);
    }
  });

  // Registro
  document.getElementById("registerBtn").addEventListener("click", async (e) => {
    e.preventDefault();
    try {
      const userCredential = await createUserWithEmailAndPassword(auth, emailInput.value, passwordInput.value);
      alert("Conta criada com sucesso para " + userCredential.user.email);
    } catch (error) {
      alert("Erro ao criar conta: " + error.message);
    }
  });
</script>
</html>
