<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Seguro</title>
  <link rel="stylesheet" href="css/style-login.css" />
</head>
<body>
  <div class="login-container">
    <form class="login-form">
      <h1>Entrar ou Criar Conta</h1>
      <div class="input-group">
        <label for="username">Usuário (email)</label>
        <input type="email" id="username" name="username" required autocomplete="username" />
      </div>
      <div class="input-group">
        <label for="password">Senha</label>
        <input type="password" id="password" name="password" required autocomplete="current-password" />
      </div>
      <button type="submit" id="loginBtn">Login</button>
      <button type="button" id="registerBtn">Criar Conta</button>
      <p class="hint">Nunca compartilhe sua senha.</p>
    </form>
  </div>
</body>

<script type="module">
    import {
        auth,
        db,
        signInWithPopup,
        googleProvider,
        onAuthStateChanged
    } from "./js/firebase-config.js";

    import {
        signInWithEmailAndPassword,
        createUserWithEmailAndPassword,
        updateProfile,
        signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    import {
        doc,
        getDoc,
        setDoc,
        serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    import { redirectByRole } from "./js/auth-guard.js";

    const form = document.querySelector(".login-form" );
    const emailInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");
    const loginButton = document.getElementById("loginBtn");
    const registerButton = document.getElementById("registerBtn");

    function setBusy(isBusy) {
        [loginButton, registerButton].forEach((button) => {
            if (button) button.disabled = isBusy;
        });
    }

    function showError(error) {
        const messages = {
            "auth/invalid-credential": "E-mail ou senha inválidos.",
            "auth/user-not-found": "Conta não encontrada. Use Criar Conta apenas se ainda não tiver cadastro.",
            "auth/wrong-password": "E-mail ou senha inválidos.",
            "auth/email-already-in-use": "Este e-mail já possui cadastro. Faça login em vez de criar outra conta.",
            "auth/weak-password": "A senha deve ter pelo menos 6 caracteres.",
            "auth/invalid-email": "Informe um e-mail válido.",
            "auth/popup-closed-by-user": "A janela de login foi fechada."
        };

        alert(messages[error.code] || "Não foi possível concluir a autenticação. Tente novamente.");
    }

    async function ensureClientProfile(user) {
        const profileRef = doc(db, "userProfiles", user.uid);
        const profileSnapshot = await getDoc(profileRef);

        if (!profileSnapshot.exists()) {
            await setDoc(profileRef, {
                uid: user.uid,
                email: user.email || "",
                displayName: user.displayName || "",
                role: "client",
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            });
            return;
        }

        const currentRole = profileSnapshot.data().role;

        if (!currentRole) {
            await setDoc(profileRef, {
                role: "client",
                updatedAt: serverTimestamp()
            }, { merge: true });
        }
    }

    async function finishAuthentication(user) {
        await ensureClientProfile(user);
        await redirectByRole(user);
    }

    loginButton.addEventListener("click", async (event) => {
        event.preventDefault();
        setBusy(true);

        try {
            const credentials = await signInWithEmailAndPassword(
                auth,
                emailInput.value.trim(),
                passwordInput.value
            );
            await finishAuthentication(credentials.user);
        } catch (error) {
            showError(error);
        } finally {
            setBusy(false);
        }
    });

    registerButton.addEventListener("click", async (event) => {
        event.preventDefault();
        setBusy(true);

        try {
            const credentials = await createUserWithEmailAndPassword(
                auth,
                emailInput.value.trim(),
                passwordInput.value
            );

            await updateProfile(credentials.user, {
                displayName: emailInput.value.trim().split("@")[0]
            });

            await ensureClientProfile(credentials.user);
            alert("Conta de cliente criada com sucesso.");
            await finishAuthentication(credentials.user);
        } catch (error) {
            showError(error);
        } finally {
            setBusy(false);
        }
    });

    form.addEventListener("submit", (event) => {
        event.preventDefault();
        loginButton.click();
    });

    onAuthStateChanged(auth, async (user) => {
        if (!user) return;

        try {
            await finishAuthentication(user);
        } catch (error) {
            console.error("Falha ao restaurar sessão:", error);
            await signOut(auth);
        }
    });

    window.addEventListener("pageshow", () => {
        if (auth.currentUser) {
            finishAuthentication(auth.currentUser).catch(console.error);
        }
    });
</script>
</html>
