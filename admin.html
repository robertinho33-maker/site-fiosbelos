<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - Studio Totti</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand font-weight-bold" href="#">
                <i class="fa fa-cogs me-2"></i>Painel de Gerenciamento
            </a>
            <a href="index.html" class="btn btn-outline-light btn-sm">Ver Loja</a>
        </div>
    </nav>

    <div class="container mb-5">
        <!-- Navegação por Abas -->
        <ul class="nav nav-tabs mb-4" id="adminTabs" role="tablist">
            <li class="nav-item">
                <button class="nav-link active fw-bold" id="products-tab" data-bs-toggle="tab" data-bs-target="#products-panel">
                    <i class="fa fa-box me-2"></i>Produtos & Estoque
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold" id="coupons-tab" data-bs-toggle="tab" data-bs-target="#coupons-panel">
                    <i class="fa fa-ticket-alt me-2"></i>Cupons de Desconto
                </button>
            </li>
        </ul>

        <div class="tab-content">
            
            <!-- ABAS DE PRODUTOS -->
            <div class="tab-pane fade show active" id="products-panel">
                <div class="row g-4">
                    <!-- Form de Cadastro -->
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-4">
                            <h5 class="fw-bold mb-3"><i class="fa fa-plus-circle me-2 text-primary"></i>Novo Produto</h5>
                            <form id="form-product" onsubmit="saveProduct(event)">
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">SKU</label>
                                    <input type="text" id="prod-sku" class="form-control form-control-sm" required placeholder="Ex: SH-001">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Produto</label>
                                    <input type="text" id="prod-name" class="form-control form-control-sm" required>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Preço (R$)</label>
                                        <input type="number" step="0.01" id="prod-price" class="form-control form-control-sm" required placeholder="0.00">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Peso</label>
                                        <input type="text" id="prod-weight" class="form-control form-control-sm" placeholder="Ex: 500g / 1L">
                                    </div>
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Categoria</label>
                                        <input type="text" id="prod-category" class="form-control form-control-sm" required placeholder="Ex: Shampoos">
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Estoque</label>
                                        <input type="number" id="prod-stock" class="form-control form-control-sm" required value="10">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Caminho da Imagem</label>
                                    <input type="text" id="prod-image" class="form-control form-control-sm" placeholder="images/products/exemplo.jpg">
                                </div>
                                <div class="mb-3">
                                    <label class="form-label small fw-bold">Descrição</label>
                                    <textarea id="prod-desc" class="form-control form-control-sm" rows="3"></textarea>
                                </div>
                                <button type="submit" class="btn btn-primary btn-sm w-100 fw-bold">
                                    <i class="fa fa-save me-1"></i>Adicionar ao Catálogo
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Tabela de Edição de Produtos -->
                    <div class="col-md-8">
                        <div class="card border-0 shadow-sm p-4">
                            <div class="d-flex justify-content-between align-items-center mb-3">
                                <h5 class="fw-bold mb-0">Produtos Cadastrados</h5>
                                <button class="btn btn-success btn-sm fw-bold" onclick="exportCSV()">
                                    <i class="fa fa-download me-1"></i>Baixar CSV Atualizado
                                </button>
                            </div>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle small">
                                    <thead class="table-light">
                                        <tr>
                                            <th>SKU</th>
                                            <th>Produto</th>
                                            <th>Preço (R$)</th>
                                            <th>Estoque</th>
                                            <th>Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody id="admin-products-list">
                                        <!-- Preenchido via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ABA DE CUPONS -->
            <div class="tab-pane fade" id="coupons-panel">
                <div class="row g-4">
                    <!-- Form Novo Cupom -->
                    <div class="col-md-4">
                        <div class="card border-0 shadow-sm p-4">
                            <h5 class="fw-bold mb-3"><i class="fa fa-ticket-alt me-2 text-success"></i>Novo Cupom</h5>
                            <form id="form-coupon" onsubmit="saveCoupon(event)">
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Código do Cupom</label>
                                    <input type="text" id="coup-code" class="form-control form-control-sm text-uppercase" required placeholder="EX: DESCONTO10">
                                </div>
                                <div class="row g-2 mb-2">
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Tipo</label>
                                        <select id="coup-type" class="form-select form-select-sm">
                                            <option value="percent">Porcentagem (%)</option>
                                            <option value="fixed">Valor Fixo (R$)</option>
                                        </select>
                                    </div>
                                    <div class="col-6">
                                        <label class="form-label small fw-bold">Valor</label>
                                        <input type="number" step="0.01" id="coup-value" class="form-control form-control-sm" required placeholder="10">
                                    </div>
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Comissão de Afiliado (%)</label>
                                    <input type="number" step="0.1" id="coup-commission" class="form-control form-control-sm" placeholder="Ex: 5">
                                </div>
                                <div class="mb-2">
                                    <label class="form-label small fw-bold">Nome do Afiliado / Indicador</label>
                                    <input type="text" id="coup-affiliate" class="form-control form-control-sm" placeholder="Ex: Roberto Ferreira">
                                </div>
                                <button type="submit" class="btn btn-success btn-sm w-100 fw-bold mt-2">
                                    <i class="fa fa-check me-1"></i>Salvar Cupom no Firebase
                                </button>
                            </form>
                        </div>
                    </div>

                    <!-- Lista de Cupons no Firestore -->
                    <div class="col-md-8">
                        <div class="card border-0 shadow-sm p-4">
                            <h5 class="fw-bold mb-3">Cupons Ativos</h5>
                            <div class="table-responsive">
                                <table class="table table-hover align-middle small">
                                    <thead class="table-light">
                                        <tr>
                                            <th>Código</th>
                                            <th>Tipo</th>
                                            <th>Valor</th>
                                            <th>Afiliado</th>
                                            <th>Comissão</th>
                                            <th>Status</th>
                                        </tr>
                                    </thead>
                                    <tbody id="admin-coupons-list">
                                        <!-- Preenchido via JS -->
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="/js/admin.js"></script>
</body>
</html>
